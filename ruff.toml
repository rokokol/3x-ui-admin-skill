# The rule set CI runs is the one written here, so a local `ruff check .` and
# the lint job disagree only when this file changes.
target-version = "py311"
line-length = 110
extend-exclude = ["__pycache__"]

[lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PLE", "PLW", "PLC", "PIE", "PERF",
  "FURB", "RET", "ISC", "FLY", "PGH", "TRY", "BLE", "DTZ", "YTT", "ASYNC", "LOG",
  "G", "EXE", "PTH", "S", "N", "C4", "PT",
]
ignore = [
  "S101",   # assert is how a test states a fact
  "S603", "S607",  # subprocess with a fixed argv, docker and the test runner
  "S108",   # the scratch file lives beside its destination, not in /tmp
  "TRY003", "TRY300",  # long messages in exceptions are the point here
  "PT009", "PT027",  # unittest, not pytest
  "RET505", "RET506",  # `else` after return reads fine
  "PLC0415",  # a command that needs one extra module imports it where it uses it
  "SIM108",   # a ternary that runs past the margin is worse than an if
  "PERF401",  # an explicit loop over a comprehension where the loop reads better
  "PLW2901",  # reassigning a loop variable to its masked form is the intent
]

[lint.per-file-ignores]
"tests/*" = ["S", "N", "PLW", "DTZ", "PTH", "E501"]
"xui" = ["E402"]
# Table and column names are this module's own lists and PRAGMA output, never input
"lib/commands/db.py" = ["S608"]
# Verification off is the documented default, and a pin is the answer to it
"lib/api.py" = ["S310", "S323"]
"lib/commands/panel.py" = ["S323"]
